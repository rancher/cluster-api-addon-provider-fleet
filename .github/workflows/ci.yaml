name: Run CI checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
  merge_group:
  workflow_dispatch:

env:
  SOURCE_REPO: https://github.com/${{ github.event.pull_request.head.repo.full_name || 'rancher/cluster-api-addon-provider-fleet' }}
  SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install just
        run: cargo install just
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build
        run: just compile

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install just
        run: cargo install just
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Test
        run: just test-unit

  test-e2e:
    name: test-e2e ${{ matrix.display_name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - kube_version: "1.34.0"
            display_name: "stable"
          - kube_version: "1.35.0"
            display_name: "latest"
    env:
      KUBE_VERSION: ${{ matrix.kube_version }}
    steps:
      - name: Install just
        run: cargo install just
      - name: Install kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
        with:
          install_only: true
          version: v0.29.0
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Test (Cluster Class) - ${{ matrix.display_name }}
        run: just test-cluster-class-import
      - name: Collect artifacts
        if: always()
        run: just collect-test-cluster-class-import
      - name: Store run artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: artifacts-cluster-class-import-${{ matrix.display_name }}
          path: _out/gather

  test-e2e-import:
    name: test-e2e-import ${{ matrix.display_name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - kube_version: "1.34.0"
            display_name: "stable"
          - kube_version: "1.35.0"
            display_name: "latest"
    env:
      KUBE_VERSION: ${{ matrix.kube_version }}
    steps:
      - name: Install just
        run: cargo install just
      - name: Install kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
        with:
          install_only: true
          version: v0.29.0
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Test (Import) - ${{ matrix.display_name }}
        run: just test-import
      - name: Collect artifacts
        if: always()
        run: just collect-test-import
      - name: Store run artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: artifacts-import-${{ matrix.display_name }}
          path: _out/gather

  test-e2e-import-rke2:
    name: test-e2e-import-rke2 ${{ matrix.display_name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - kube_version: "1.34.0"
            display_name: "stable"
          - kube_version: "1.35.0"
            display_name: "latest"
    env:
      KUBE_VERSION: ${{ matrix.kube_version }}
    steps:
      - name: Install just
        run: cargo install just
      - name: Install kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
        with:
          install_only: true
          version: v0.29.0
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Test (Import RKE2) - ${{ matrix.display_name }}
        run: just test-import-rke2
      - name: Collect artifacts
        if: always()
        run: just collect-test-import
      - name: Store run artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: artifacts-import-rke2-${{ matrix.display_name }}
          path: _out/gather

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -W clippy::pedantic
